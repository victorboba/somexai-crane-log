name: CraneLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  CraneLog:
    type: application
    platform: iOS
    sources:
      - path: CraneLog
      - path: Shared
    dependencies:
      - target: CraneLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crane-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: CraneLog/CraneLog.entitlements
    info:
      path: CraneLog/Info.plist
      properties:
        CFBundleDisplayName: Crane Inspection Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  CraneLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CraneLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crane-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CraneLogWidget/CraneLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: CraneLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Crane Inspection Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CraneLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CraneLogTests
    dependencies:
      - target: CraneLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crane-log.tests
        GENERATE_INFOPLIST_FILE: YES
  CraneLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CraneLogUITests
    dependencies:
      - target: CraneLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crane-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CraneLog
schemes:
  CraneLog:
    build:
      targets:
        CraneLog: all
        CraneLogTests: [test]
        CraneLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: CraneLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: CraneLog/StoreKit/Products.storekit
      targets:
        - CraneLogTests
        - CraneLogUITests
    archive:
      config: Release
